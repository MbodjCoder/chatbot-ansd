name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r backend/requirements.txt

      - name: Construire la base et le classifieur
        working-directory: backend
        env:
          ANSD_MODE: demo
        run: |
          python scripts/seed_db.py
          python scripts/train_router.py

      - name: Tests (mode démo, déterministe)
        working-directory: backend
        env:
          ANSD_MODE: demo
        run: python -m pytest -q

      - name: Évaluation (requêtes SQL et jeu de référence)
        working-directory: backend
        env:
          ANSD_MODE: demo
        run: |
          python -m app.evaluation.evaluate_sql
          python scripts/evaluate.py

  build-image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que l'image Docker se construit
        run: docker build -t chatbot-ansd:ci .
