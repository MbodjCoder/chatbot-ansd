# ============================================================================
# Déploiement Fly.io de RAMA — API FastAPI + interface (même origine),
# recherche TF-IDF (aucune dépendance GPU/vectorielle).
# Région Paris (CDG) : proche du Sénégal, bonne latence.
# Machine TOUJOURS ACTIVE = performances constantes (pas de démarrage à froid).
#
# La clé LLM n'est JAMAIS ici : elle est posée en secret ->
#     fly secrets set ANSD_LLM_API_KEY="votre_cle_groq"
# ============================================================================

app = "rama-ansd-ugb"      # doit correspondre à `fly apps create <ce-nom>`
primary_region = "cdg"     # Paris. Alternatives proches : "lhr" (Londres), "fra" (Francfort)

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ANSD_MODE = "production"
  ANSD_LLM_PROVIDER = "groq"
  ANSD_LLM_GEN = "auto"
  ANSD_LLM_AUX = "auto"
  # Fly place un proxy de confiance devant l'app (X-Forwarded-For fiable) :
  ANSD_TRUST_PROXY = "true"
  # L'UI est servie en même origine (CORS inutile pour elle). Adapter si des
  # applications tierces appellent l'API. Mettre l'URL finale de l'app.
  ANSD_CORS_ORIGINS = "https://rama-ansd-ugb.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # ne pas éteindre : perfs constantes
  auto_start_machines = true
  min_machines_running = 1     # au moins 1 machine toujours en marche

  [[http_service.checks]]
    method = "get"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"               # confortable pour sklearn/TF-IDF ; passer à
                               # "performance-1x" si tu veux un CPU dédié.
