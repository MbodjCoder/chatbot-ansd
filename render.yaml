# Déploiement Render (New > Blueprint > ce dépôt). Dockerfile racine, Francfort.
# La clé du modèle n'est pas ici : Render la demande à la création (sync: false).
# Le nom du service fixe l'adresse en ligne : ne pas le modifier.
services:
  - type: web
    name: rama
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANSD_MODE
        value: production
      - key: ANSD_LLM_PROVIDER
        value: groq
      - key: ANSD_TRUST_PROXY
        value: "true"
      - key: ANSD_LLM_API_KEY
        sync: false
