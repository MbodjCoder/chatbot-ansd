# Déploiement sur un serveur : docker compose up -d
# Variables lues dans un fichier .env placé à côté (voir .env.example).
services:
  api:
    build: .
    environment:
      ANSD_MODE: production
      ANSD_LLM_PROVIDER: ${ANSD_LLM_PROVIDER:-groq}
      ANSD_LLM_API_KEY: ${ANSD_LLM_API_KEY:?definir ANSD_LLM_API_KEY dans .env}
      ANSD_LLM_GEN: ${ANSD_LLM_GEN:-auto}
      ANSD_LLM_AUX: ${ANSD_LLM_AUX:-auto}
      ANSD_CORS_ORIGINS: ${ANSD_CORS_ORIGINS:-https://www.ansd.sn,https://ansd.sn}
      # true uniquement derrière un proxy de confiance (nginx, caddy)
      ANSD_TRUST_PROXY: ${ANSD_TRUST_PROXY:-false}
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes:
      - journaux:/srv/data/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health',timeout=4).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  journaux:
