<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="description" content="Rama : posez vos questions sur les statistiques du Sénégal — chiffres, comparaisons et documents, d'après les données publiques de l'ANSD.">
<title>Rama — Statistiques du Sénégal</title>
<meta name="theme-color" content="#0e79c4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08121f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/rama.svg">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RAMA">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:title" content="Rama — Statistiques du Sénégal">
<meta property="og:description" content="Les statistiques du Sénégal, en une question. Réponses fondées sur les données publiques de l'ANSD, sources à l'appui.">
<meta property="og:image" content="/icon-512.png">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Rama — Statistiques du Sénégal">
<meta name="twitter:description" content="Les statistiques du Sénégal, en une question. Réponses sourcées.">

<style>
  /* ============ Jetons de thème (clair par défaut) ============ */
  /* Palette ANSD : bleu sombre (marine) · bleu océan · blanc */
  :root{
    --papier:#ffffff; --carte:#ffffff; --carte2:#eaf2fa;
    --encre:#0a2440; --encre2:#3f5972; --encre3:#70879e;
    --ligne:#dce7f2; --ligne2:#c9d9ea; --accent:#0e79c4; --accent-fonce:#0b2f5c;
    --accent-doux:#0e79c414;
    --mark:#0e79c4;
    --sql:#0e79c4; --rag:#3a5fa8; --hyb:#6a5acd; --guard:#b3541e;
    --ombre:0 1px 2px rgba(11,36,64,.06),0 4px 14px rgba(11,36,64,.06);
    --ombre-fort:0 4px 12px rgba(11,36,64,.10),0 16px 40px rgba(11,36,64,.12);
  }
  [data-theme="dark"]{
    --papier:#08121f; --carte:#101d2e; --carte2:#16263b;
    --encre:#e6f0fb; --encre2:#a3b8d0; --encre3:#7089a2;
    --ligne:#213649; --ligne2:#2c435c; --accent:#3fa4e6; --accent-fonce:#2472b0;
    --accent-doux:#3fa4e622;
    --or:#5cb6ee; --mark:#3fa4e6;
    --sql:#3fa4e6; --rag:#6c8fd6; --hyb:#9a8be6; --guard:#d0793f;
    --ombre:0 1px 2px rgba(0,0,0,.38),0 4px 14px rgba(0,0,0,.30);
    --ombre-fort:0 8px 30px rgba(0,0,0,.48);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  .skip{position:absolute;left:8px;top:-48px;z-index:100;background:var(--accent);
    color:#fff;padding:9px 14px;border-radius:10px;font-size:.85rem;font-weight:600;
    text-decoration:none;transition:top .15s}
  .skip:focus{top:8px;outline:2px solid #fff;outline-offset:2px}
  /* App-shell FIXE : la racine ne défile jamais, seul #chat défile.
     Hauteur = --appvh (piloté en JS via visualViewport) = zone RÉELLEMENT
     visible au-dessus du clavier. Ainsi, clavier ouvert, l'app se réduit et la
     barre de saisie reste juste au-dessus du clavier (jamais masquée), sans
     débordement ni zoom. Replis : 100dvh puis 100vh si dvh/JS absents. */
  html,body{height:100vh;height:100dvh;max-width:100%;overflow:hidden;overscroll-behavior:none}
  img,svg,video,canvas{max-width:100%}
  body{
    position:fixed;top:0;left:0;right:0;
    height:100vh;height:100dvh;height:var(--appvh,100dvh);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    background:var(--papier);color:var(--encre);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background .25s,color .25s;
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  ::selection{background:var(--accent-doux);color:var(--accent)}
  /* barre de defilement discrete */
  #chat::-webkit-scrollbar{width:10px}
  #chat::-webkit-scrollbar-thumb{background:var(--ligne2);border-radius:99px;border:3px solid var(--papier)}
  #chat::-webkit-scrollbar-thumb:hover{background:var(--encre3)}

  /* ============ En-tête ============ */
  header{
    flex:none;height:56px;
    background:var(--papier);border-bottom:1px solid var(--ligne);
    padding:0 20px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:10;
    padding-top:env(safe-area-inset-top);
  }
  body.vide header{border-bottom-color:transparent}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo-mark{flex:none;width:26px;height:26px;border-radius:7px;overflow:hidden}
  .logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
  .logo h1{font-size:1.02rem;font-weight:600;letter-spacing:-.01em;color:var(--encre)}
  .spacer{flex:1}
  .btn-ico{
    background:none;border:1px solid var(--ligne);border-radius:10px;color:var(--encre2);
    width:36px;height:36px;cursor:pointer;font-size:.95rem;flex:none;
    display:grid;place-items:center;transition:background .15s,border-color .15s,color .15s;
  }
  .btn-ico:hover{background:var(--carte2);border-color:var(--ligne2);color:var(--encre)}
  .btn-ico:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Nouvelle conversation : seule action d'en-tête, utile seulement une fois
     la conversation commencée (masquée sur l'accueil). */
  body.vide #btn-nouveau{display:none}

  /* ============ Fil de conversation ============ */
  #chat{flex:1;min-height:0;overflow-y:auto;padding:14px 0 6px;scroll-behavior:smooth}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px}
  .msg{margin-bottom:15px;display:flex;flex-direction:column;animation:pop .2s ease-out;scroll-margin-top:12px}
  /* avatar du bot : identite visuelle discrete */
  .avarow{display:flex;gap:9px;align-items:flex-start}
  .avatar{
    flex:none;width:28px;height:28px;margin-bottom:2px;
    border-radius:8px;overflow:hidden;border:1px solid var(--ligne);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .bot>.meta,.bot>.tabres,.bot>.graf,.bot>.liens,.bot>details.sqlbox{margin-left:37px}
  .bot .tabres,.bot .graf,.bot .liens{max-width:calc(92% - 37px)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .user .bulle{
    align-self:flex-end;background:var(--accent);color:#fff;
    border-radius:16px 16px 4px 16px;max-width:78%;
  }
  [data-theme="dark"] .user .bulle{color:#0d1512}
  .bot .bulle{
    align-self:flex-start;background:var(--carte);border:1px solid var(--ligne);
    border-radius:16px 16px 16px 4px;max-width:92%;box-shadow:var(--ombre);
  }
  .bulle{padding:13px 16px;line-height:1.6;font-size:.94rem;overflow-wrap:anywhere;word-break:break-word}
  .bulle p+p{margin-top:8px}
  /* liens inline dans les réponses */
  .bot .bulle a{color:var(--accent);text-decoration:none;
    border-bottom:1px solid var(--accent-doux);font-weight:550;transition:border-color .15s}
  .bot .bulle a:hover{border-bottom-color:var(--accent)}
  .bot .bulle a[target]::after{content:"↗";font-size:.72em;margin-left:1px;opacity:.7}
  /* puces */
  .bulle .li{display:block;padding-left:16px;position:relative;margin-top:3px}
  .bulle .li::before{content:"";position:absolute;left:4px;top:.62em;
    width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .bulle table{border-collapse:collapse;margin-top:8px;font-size:.85rem;max-width:100%;display:block;overflow-x:auto}
  .bulle th,.bulle td{border:1px solid var(--ligne);padding:4px 10px;text-align:left}
  .bulle th{background:var(--carte2);font-weight:600}

  /* méta : badges + chips */
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-self:flex-start;font-size:.72rem;align-items:center;max-width:92%}
  .badge{
    padding:2.5px 10px;border-radius:99px;font-weight:700;letter-spacing:.04em;
    border:1px solid transparent;
  }
  .b-SQL{background:color-mix(in srgb,var(--sql) 14%,transparent);color:var(--sql);border-color:color-mix(in srgb,var(--sql) 35%,transparent)}
  .b-RAG{background:color-mix(in srgb,var(--rag) 14%,transparent);color:var(--rag);border-color:color-mix(in srgb,var(--rag) 35%,transparent)}
  .b-HYBRID{background:color-mix(in srgb,var(--hyb) 14%,transparent);color:var(--hyb);border-color:color-mix(in srgb,var(--hyb) 35%,transparent)}
  .b-guard{background:color-mix(in srgb,var(--guard) 14%,transparent);color:var(--guard);border-color:color-mix(in srgb,var(--guard) 35%,transparent)}
  .chip{padding:2.5px 10px;border-radius:99px;background:var(--carte2);border:1px solid var(--ligne);color:var(--encre2)}
  .fb{display:flex;gap:4px;margin-left:auto}
  .fb button{
    background:none;border:1px solid var(--ligne);border-radius:7px;cursor:pointer;
    font-size:.8rem;padding:2px 8px;color:var(--encre3);transition:all .15s;
  }
  .fb button:hover{background:var(--carte2)}
  .fb button.actif{background:var(--accent-doux);color:var(--accent);border-color:var(--accent)}
  .fb button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  details.sqlbox{margin-top:7px;font-size:.75rem;color:var(--encre2);max-width:92%}
  details.sqlbox summary{cursor:pointer;user-select:none}
  details.sqlbox summary:hover{color:var(--accent)}
  details.sqlbox code{
    display:block;background:#0f1c17;color:#8fd9ba;padding:9px 12px;border-radius:9px;
    margin-top:6px;font-size:.73rem;overflow-x:auto;font-family:Consolas,monospace;
  }

  /* ============ Graphique (barres, série unique) ============ */
  .graf{
    margin-top:10px;background:var(--carte);border:1px solid var(--ligne);
    border-radius:12px;padding:14px 16px 10px;max-width:92%;box-shadow:var(--ombre);
  }
  .graf h4{font-size:.78rem;font-weight:600;color:var(--encre2);margin-bottom:10px;letter-spacing:.02em}
  .brow{display:grid;grid-template-columns:118px 1fr 74px;align-items:center;gap:8px;margin-bottom:6px;font-size:.76rem}
  .brow .lab{color:var(--encre2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .piste{height:14px;position:relative;border-radius:0 4px 4px 0}
  .brow .barre{
    height:14px;background:var(--mark);border-radius:0 4px 4px 0;
    min-width:2px;transition:width .5s ease-out;position:relative;
  }
  .brow .barre:hover{filter:brightness(1.15)}
  .brow .val{color:var(--encre3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .graf .note{font-size:.68rem;color:var(--encre3);margin-top:6px}
  .graf svg{display:block;width:100%;height:auto}
  .graf .pt:hover{r:6}

  /* tableau de resultats */
  .tabres{margin-top:10px;max-width:92%;overflow-x:auto;border:1px solid var(--ligne);
    border-radius:12px;box-shadow:var(--ombre);background:var(--carte)}
  .tabres table{border-collapse:collapse;width:100%;font-size:.82rem}
  .tabres th{background:var(--carte2);font-weight:600;color:var(--encre2);
    text-align:left;padding:8px 12px;border-bottom:1.5px solid var(--ligne);white-space:nowrap}
  .tabres td{padding:6px 12px;border-bottom:1px solid var(--ligne);font-variant-numeric:tabular-nums}
  .tabres tr:last-child td{border-bottom:none}
  .tabres tr:hover td{background:var(--accent-doux)}

  /* cartes de liens ANSD */
  .liens{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-width:92%}
  .liens a{
    display:flex;align-items:center;gap:10px;text-decoration:none;
    background:var(--carte);border:1px solid var(--ligne);border-radius:10px;
    padding:8px 12px;color:var(--encre2);font-size:.8rem;transition:all .15s;
  }
  .liens a{min-width:0}
  .liens a:hover{border-color:var(--accent);color:var(--accent);transform:translateX(2px)}
  .liens a .ico{flex:none;font-size:.95rem}
  /* bloc texte central : occupe l'espace restant et peut rétrécir (min-width:0)
     pour que l'URL soit tronquée dans la carte au lieu de la faire déborder */
  .liens a>span{min-width:0;flex:1;overflow:hidden}
  .liens a .t{font-weight:600;color:var(--encre);overflow-wrap:anywhere}
  .liens a:hover .t{color:var(--accent)}
  .liens a .u{display:block;color:var(--encre3);font-size:.7rem;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .liens a .ext{margin-left:auto;color:var(--encre3);flex:none}

  /* bouton copier */
  .copier{
    background:none;border:1px solid var(--ligne);border-radius:7px;cursor:pointer;
    font-size:.72rem;padding:2px 9px;color:var(--encre3);transition:all .15s;
  }
  .copier:hover{background:var(--carte2);color:var(--encre)}
  .curseur{display:inline-block;width:7px;height:1em;background:var(--accent);
    vertical-align:text-bottom;animation:clign .8s steps(1) infinite;border-radius:1px}
  @keyframes clign{50%{opacity:0}}

  /* suggestions de suivi contextuelles */
  .suivre{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;max-width:92%}
  .suivre button{
    background:var(--accent-doux);border:1px solid transparent;color:var(--accent);
    border-radius:16px;padding:6px 13px;font-size:.78rem;cursor:pointer;
    font-family:inherit;transition:all .15s;text-align:left;
    max-width:100%;overflow-wrap:anywhere;
  }
  .suivre button:hover{border-color:var(--accent);transform:translateY(-1px)}

  /* ============ Accueil : une phrase, la saisie, quatre exemples ============ */
  #chat.vide{display:flex;flex-direction:column;justify-content:safe center}
  #chat.vide .wrap{width:100%}
  .accueil{text-align:center;animation:heroIn .5s cubic-bezier(.22,1,.36,1)}
  @keyframes heroIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .accueil h2{
    font-size:1.75rem;font-weight:600;letter-spacing:-.025em;line-height:1.25;
    color:var(--encre);text-wrap:balance;
  }

  /* indicateur de frappe */
  .frappe{display:flex;gap:5px;padding:4px 2px;align-items:center}
  .frappe .attente{font-size:.78rem;color:var(--encre3);margin-left:8px}
  .frappe i{
    width:7px;height:7px;border-radius:50%;background:var(--encre3);
    animation:reb 1.1s infinite;
  }
  .frappe i:nth-child(2){animation-delay:.18s}
  .frappe i:nth-child(3){animation-delay:.36s}
  @keyframes reb{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}

  /* ============ Barre de saisie ============ */
  /* flex-none : la barre garde sa taille et reste collée au bas du shell.
     Marge basse un peu plus grande (prompt légèrement remonté) + respect de la
     zone sûre iOS (encoche/barre gestuelle) pour qu'il ne soit jamais masqué. */
  /* marge basse généreuse : la saisie ne colle pas au bord de l'écran
     (barres gestuelles et pouces sur mobile, regard sur grand écran) */
  #barre{flex:none;background:var(--papier);
    padding:4px 0 calc(28px + env(safe-area-inset-bottom))}
  #barre .wrap{max-width:720px;display:flex;flex-direction:column}
  .sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center;
    max-height:38px;overflow:hidden}
  .sugg:empty{display:none}
  .sugg button{
    background:none;color:var(--encre2);border:1px solid var(--ligne);
    padding:8px 14px;font-size:.86rem;border-radius:999px;cursor:pointer;
    transition:background .15s,color .15s;font-family:inherit;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;
  }
  .sugg button:hover{background:var(--carte2);color:var(--encre)}
  .sugg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* champ de saisie : contour fin, bouton d'envoi rond intégré */
  .saisie{position:relative;display:flex}
  input#q{
    flex:1;min-width:0;height:58px;padding:0 62px 0 22px;
    border:1px solid var(--ligne2);border-radius:29px;
    /* 16px : sous ce seuil, iOS/Safari zoome automatiquement au focus. */
    font-size:16px;outline:none;background:var(--carte);color:var(--encre);
    box-shadow:0 1px 2px rgba(11,27,43,.04),0 6px 24px rgba(11,27,43,.06);
    font-family:inherit;transition:border-color .15s;
  }
  input#q::placeholder{color:var(--encre3)}
  input#q:focus{border-color:color-mix(in srgb,var(--accent) 45%,var(--ligne2))}
  button#go{
    position:absolute;right:9px;top:50%;translate:0 -50%;
    width:40px;height:40px;border-radius:50%;border:none;cursor:default;
    background:var(--accent);color:#fff;display:grid;place-items:center;padding:0;
    opacity:.25;pointer-events:none;transition:opacity .15s;
  }
  button#go.actif{opacity:1;pointer-events:auto;cursor:pointer}
  [data-theme="dark"] button#go{color:#0d1512}
  button#go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* Bouton unique à trois états, permutés automatiquement (#98) :
     champ vide -> micro · texte -> flèche d'envoi · dictée -> arrêt. */
  button#go .ico{position:absolute;inset:0;margin:auto;width:18px;height:18px;
    opacity:0;transform:scale(.5);
    transition:opacity .16s,transform .22s cubic-bezier(.34,1.56,.64,1)}
  button#go .ico-envoi{opacity:1;transform:none}
  button#go.micro .ico-envoi,button#go.ecoute .ico-envoi{opacity:0;transform:scale(.5)}
  button#go.micro .ico-micro,button#go.ecoute .ico-stop{opacity:1;transform:none}
  button#go.micro,button#go.ecoute{opacity:1;pointer-events:auto;cursor:pointer}
  button#go.micro{background:transparent;color:var(--encre2)}
  [data-theme="dark"] button#go.micro{color:var(--encre2)}
  button#go.micro:hover{background:var(--carte2);color:var(--encre)}
  /* dictée : anneau qui respire (moteur navigateur) ou suit le niveau de la
     voix (moteur serveur, variable --niveau posée en direct) */
  button#go.ecoute::after{content:"";position:absolute;inset:0;border-radius:50%;
    pointer-events:none;
    box-shadow:0 0 0 calc(3px + var(--niveau,0) * 10px) color-mix(in srgb,var(--accent) 22%,transparent);
    transition:box-shadow .08s linear;animation:onde 1.6s ease-in-out infinite}
  button#go.ecoute[style*="--niveau"]::after{animation:none}
  @keyframes onde{
    0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
    50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 8%,transparent)}}
  button#go.traite{opacity:.55;pointer-events:none}
  button#go:disabled{opacity:.25;pointer-events:none}
  .saisie.ecoute input#q{border-color:color-mix(in srgb,var(--accent) 55%,var(--ligne2))}
  .mention{text-align:center;font-size:.74rem;color:var(--encre3);margin-top:10px}
  .mention a{color:inherit;text-underline-offset:2px}

  /* Accueil, grand écran : la saisie remonte au centre, sous la phrase, et
     les exemples passent dessous. Mobile : elle reste en bas, au pouce. */
  @media (min-width:641px){
    body.vide #chat{flex:0 0 auto;margin-top:auto;padding-bottom:28px;overflow:visible}
    body.vide #barre{margin-bottom:auto;padding-bottom:8vh}
    body.vide .sugg{order:2;margin:16px 0 0}
    body.vide .mention{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom))}
  }

  /* bouton flottant "descendre au dernier message" */
  #bas{
    position:fixed;right:22px;bottom:140px;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--ligne);background:var(--carte);color:var(--encre2);
    cursor:pointer;box-shadow:var(--ombre);font-size:1rem;display:none;
    align-items:center;justify-content:center;z-index:5;transition:all .15s;
  }
  #bas:hover{color:var(--accent);border-color:var(--accent)}
  #bas.visible{display:flex}

  @media (max-width:640px){
    #barre{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
    header{padding:0 14px}
    .accueil h2{font-size:1.4rem;padding:0 8px}
    .sugg{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;max-height:none}
    .sugg::-webkit-scrollbar{display:none}
    .sugg button{flex:none}
    .bot>.meta,.bot>.tabres,.bot>.graf,.bot>.liens,.bot>details.sqlbox{margin-left:0}
    .bot .bulle,.bot .tabres,.bot .graf,.bot .liens,.meta,details.sqlbox{max-width:100%}
    .user .bulle{max-width:88%}
    .brow{grid-template-columns:92px 1fr 64px}
  }
</style>
</head>
<body class="vide">
<a class="skip" href="#q">Aller à la zone de saisie</a>
<header>
  <div class="logo">
    <span class="logo-mark"><img src="rama.svg" width="26" height="26" alt=""></span>
    <h1>Rama</h1>
  </div>
  <div class="spacer"></div>
  <button class="btn-ico" id="btn-nouveau" title="Nouvelle conversation" aria-label="Nouvelle conversation">⟳</button>
</header>

<div id="chat" class="vide"><div class="wrap" id="fil" aria-live="polite">
  <div class="accueil">
    <h2>Que voulez-vous savoir sur le Sénégal&nbsp;?</h2>
  </div>
</div></div>

<div id="barre"><div class="wrap">
  <div class="sugg" id="sugg" role="group" aria-label="Suggestions de questions"></div>
  <form id="f" class="saisie">
    <input id="q" placeholder="Population, emploi, pauvreté, prix…"
           autocomplete="off" required maxlength="500" aria-label="Votre question">
    <button id="go" type="submit" aria-label="Envoyer la question" title="Envoyer">
      <svg class="ico ico-envoi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg class="ico ico-micro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="ico ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor"/></svg>
    </button>
  </form>
  <p class="mention">Rama peut se tromper. Vérifiez les chiffres sur <a href="https://www.ansd.sn" target="_blank" rel="noopener">ansd.sn</a> · <a href="/a-propos.html">À propos</a></p>
  <button id="bas" aria-label="Aller au dernier message" title="Dernier message">↓</button>
</div></div>

<script>
"use strict";
/* ============ état global ============ */
const fil = document.getElementById('fil'), f = document.getElementById('f'),
      q = document.getElementById('q'), go = document.getElementById('go');
let sessionId = null;
let transcript = [];
let dernieresSuggs = null;   /* suggestions contextuelles du dernier tour */
let suivreBas = true;        /* auto-suivi : caler la réponse en haut, sauf si l'utilisateur a défilé */

/* ============ thème : suit le réglage clair/sombre de l'appareil ============ */
const racine = document.documentElement;
const sombre = matchMedia('(prefers-color-scheme: dark)');
function appliqueTheme(t){ racine.setAttribute('data-theme', t); }
appliqueTheme(sombre.matches ? 'dark' : 'light');
sombre.addEventListener('change', e => appliqueTheme(e.matches ? 'dark' : 'light'));

/* ============ utilitaires ============ */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){ // rendu markdown minimal sur texte déjà échappé
  return esc(s)
    // liens [texte](url) -> ancre cliquable (URL restreinte à http/https)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    // listes à puces "- item" / "* item" / "• item" en début de ligne
    .replace(/(^|\n)\s*[-•*]\s+(.+)/g,'$1<span class="li">$2</span>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
}
function fmtNum(v){
  if (typeof v === 'number' && Number.isInteger(v) && Math.abs(v) >= 10000)
    return v.toLocaleString('fr-FR');
  return String(v);
}
/* libellés lisibles pour les colonnes de la base */
const LIBELLES = {
  nom:'région', annee:'année', population:'population',
  taux_pauvrete:'taux de pauvreté (%)', taux_chomage_elargi:'taux de chômage élargi (%)',
  taux_chomage_bit:'taux de chômage BIT (%)', taux_activite:"taux d'activité (%)",
  taux_inflation:'inflation (%)', croissance_reelle:'croissance du PIB (%)',
  superficie_km2:'superficie (km²)', gini:'indice de Gini',
  conso_moyenne_fcfa:'consommation moyenne (FCFA/an)', trimestre:'trimestre',
  profondeur:'profondeur (%)', severite:'sévérité (%)', valeur:'valeur',
  libelle:'indicateur', densite_hab_km2:'densité (hab/km²)'
};
const lib = c => LIBELLES[c] || c;

/* ============ suggestions : UNE zone, évolutive avec la conversation ====
   À l'accueil : quatre amorces courtes (libellé bref, question complète).
   Ensuite : les suggestions contextuelles renvoyées par le backend (liées au
   sujet courant, jamais déjà posées). Chaque amorce est vérifiée répondable. */
const AMORCES = [
  {libelle:"Population du Sénégal", q:"Combien d'habitants compte le Sénégal ?"},
  {libelle:"Taux de chômage", q:"Quel est le taux de chômage ?"},
  {libelle:"Région la plus pauvre", q:"Quelle région est la plus pauvre ?"},
  {libelle:"Inflation en 2024", q:"Quelle est l'inflation en 2024 ?"},
];
function montreSuggs(liste){
  const zone = document.getElementById('sugg');
  zone.innerHTML = '';
  for (const s of (liste || []).slice(0, 4)){
    const {libelle, q: question} = typeof s === 'string' ? {libelle: s, q: s} : s;
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = libelle;
    if (libelle !== question) b.title = question;
    b.onclick = () => poser(question);
    zone.appendChild(b);
  }
}

/* ============ graphique : barres horizontales, série unique ============ */
/* Déclenché quand le SQL renvoie ≥3 lignes avec 1 colonne numérique.
   Marques fines, extrémité arrondie côté données, étiquettes de valeur en
   encre atténuée (l'axe est remplacé par les étiquettes directes). */
function grafBarres(data){
  const {columns, rows} = data;
  if (!rows || rows.length < 3) return null;
  const iNum = columns.findIndex((c,i) => rows.every(r => typeof r[i] === 'number'));
  const iLab = columns.findIndex((c,i) => i !== iNum);
  if (iNum < 0 || iLab < 0 || columns.length > 3) return null;
  const vals = rows.map(r => r[iNum]);
  const max = Math.max(...vals);
  if (!(max > 0)) return null;
  const boite = document.createElement('div');
  boite.className = 'graf';
  boite.setAttribute('role','img');
  boite.setAttribute('aria-label', lib(columns[iNum]) + ' par ' + lib(columns[iLab]));
  const h = document.createElement('h4');
  h.textContent = lib(columns[iNum] || 'valeur') + ' — par ' + lib(columns[iLab] || 'catégorie');
  boite.appendChild(h);
  for (const r of rows){
    const ligne = document.createElement('div'); ligne.className = 'brow';
    const lab = document.createElement('div'); lab.className = 'lab';
    lab.textContent = r[iLab]; lab.title = r[iLab];
    const piste = document.createElement('div'); piste.className = 'piste';
    const barre = document.createElement('div'); barre.className = 'barre';
    barre.style.width = (100 * r[iNum] / max).toFixed(1) + '%';
    barre.title = r[iLab] + ' : ' + fmtNum(r[iNum]);
    piste.appendChild(barre);
    const val = document.createElement('div'); val.className = 'val';
    val.textContent = fmtNum(r[iNum]);
    ligne.append(lab, piste, val);
    boite.appendChild(ligne);
  }
  const note = document.createElement('div'); note.className = 'note';
  note.textContent = 'Source : données publiées par l\'ANSD (requête SQL tracée ci-dessous).';
  boite.appendChild(note);
  return boite;
}

/* série temporelle ? (colonne d'années + 1 colonne numérique, ≥4 points) */
function serieTemporelle(data){
  const {columns, rows} = data;
  if (!rows || rows.length < 4) return null;
  const iAn = columns.findIndex((c,i) =>
    /annee|année/i.test(c) && rows.every(r => Number.isInteger(r[i]) && r[i] > 1900 && r[i] < 2100));
  if (iAn < 0) return null;
  const iVal = columns.findIndex((c,i) => i !== iAn && rows.every(r => typeof r[i] === 'number'));
  if (iVal < 0) return null;
  return {iAn, iVal};
}

/* courbe SVG (série unique) : trait 2px, points ≥8px, étiquettes directes
   premier/dernier + min/max, grille discrète, infobulles natives */
function grafLigne(data, st){
  const {columns, rows} = data;
  const pts = rows.map(r => ({x: r[st.iAn], y: r[st.iVal]})).sort((a,b) => a.x - b.x);
  const W = 640, H = 230, m = {t: 18, r: 46, b: 30, l: 14};
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.12 || 1;
  const X = v => m.l + (W - m.l - m.r) * (v - x0) / Math.max(1, x1 - x0);
  const Y = v => H - m.b - (H - m.t - m.b) * (v - (y0 - pad)) / ((y1 + pad) - (y0 - pad));
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const css = getComputedStyle(document.documentElement);
  const cMark = css.getPropertyValue('--mark').trim(),
        cLigne = css.getPropertyValue('--ligne').trim(),
        cEncre2 = css.getPropertyValue('--encre2').trim(),
        cEncre3 = css.getPropertyValue('--encre3').trim();
  // grille horizontale discrète (3 lignes)
  for (let g = 0; g < 3; g++){
    const gy = m.t + (H - m.t - m.b) * g / 2;
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', m.l); l.setAttribute('x2', W - m.r);
    l.setAttribute('y1', gy); l.setAttribute('y2', gy);
    l.setAttribute('stroke', cLigne); l.setAttribute('stroke-width', '1');
    svg.appendChild(l);
  }
  const poly = document.createElementNS(ns, 'polyline');
  poly.setAttribute('points', pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' '));
  poly.setAttribute('fill', 'none');
  poly.setAttribute('stroke', cMark);
  poly.setAttribute('stroke-width', '2');
  poly.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(poly);
  const extremes = new Set([0, pts.length - 1, ys.indexOf(y0), ys.indexOf(y1)]);
  pts.forEach((p, i) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('class', 'pt');
    c.setAttribute('cx', X(p.x)); c.setAttribute('cy', Y(p.y)); c.setAttribute('r', 4.5);
    c.setAttribute('fill', cMark);
    const ti = document.createElementNS(ns, 'title');
    ti.textContent = p.x + ' : ' + fmtNum(p.y);
    c.appendChild(ti);
    svg.appendChild(c);
    // étiquettes directes sélectives : extrêmes seulement
    if (extremes.has(i)){
      const t = document.createElementNS(ns, 'text');
      const versLaFin = X(p.x) > W - 110;
      t.setAttribute('x', versLaFin ? X(p.x) - 7 : X(p.x) + 7);
      t.setAttribute('text-anchor', versLaFin ? 'end' : 'start');
      t.setAttribute('y', Y(p.y) - 8);
      t.setAttribute('fill', cEncre2); t.setAttribute('font-size', '11');
      t.textContent = fmtNum(p.y);
      svg.appendChild(t);
    }
    // années sur l'axe
    const ax = document.createElementNS(ns, 'text');
    ax.setAttribute('x', X(p.x)); ax.setAttribute('y', H - 8);
    ax.setAttribute('fill', cEncre3); ax.setAttribute('font-size', '10.5');
    ax.setAttribute('text-anchor', 'middle');
    if (pts.length <= 9 || extremes.has(i)) ax.textContent = p.x;
    svg.appendChild(ax);
  });
  const boite = document.createElement('div'); boite.className = 'graf';
  boite.setAttribute('role', 'img');
  boite.setAttribute('aria-label', lib(columns[st.iVal]) + ' par ' + lib(columns[st.iAn]));
  const h = document.createElement('h4');
  h.textContent = lib(columns[st.iVal]) + ' — évolution par ' + lib(columns[st.iAn]);
  boite.append(h, svg);
  const note = document.createElement('div'); note.className = 'note';
  note.textContent = 'Source : données publiées par l\'ANSD (requête SQL tracée ci-dessous).';
  boite.appendChild(note);
  return boite;
}

/* tableau HTML des résultats (vue accessible, toujours fournie avec un graphe) */
function tableau(data){
  const {columns, rows} = data;
  const box = document.createElement('div'); box.className = 'tabres';
  const t = document.createElement('table');
  const tr = document.createElement('tr');
  for (const c of columns){
    const th = document.createElement('th'); th.textContent = lib(c); tr.appendChild(th);
  }
  t.appendChild(tr);
  for (const r of rows){
    const tl = document.createElement('tr');
    for (const v of r){
      const td = document.createElement('td');
      td.textContent = v === null ? '—' : fmtNum(v);
      tl.appendChild(td);
    }
    t.appendChild(tl);
  }
  box.appendChild(t);
  return box;
}

/* cartes de liens vers les publications officielles ANSD */
function cartesLiens(links){
  if (!links || !links.length) return null;
  const box = document.createElement('div'); box.className = 'liens';
  const ICO = {pdf:'📄', portail:'🌐', indicateur:'📊', rapports:'📚', note:'📰', methodologie:'🧪'};
  for (const l of links){
    const a = document.createElement('a');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<span class="ico">' + (ICO[l.type] || '🔗') + '</span>' +
      '<span><span class="t">' + esc(l.titre) + '</span><br><span class="u">' + esc(l.url) + '</span></span>' +
      '<span class="ext">↗</span>';
    box.appendChild(a);
  }
  return box;
}

/* ============ bulles ============ */
function bulle(role, node){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bulle';
  if (typeof node === 'string') b.innerHTML = node; else b.appendChild(node);
  if (role === 'bot'){
    const row = document.createElement('div'); row.className = 'avarow';
    const av = document.createElement('div'); av.className = 'avatar';
    av.innerHTML = '<img src="rama.svg" width="28" height="28" alt="">';
    av.setAttribute('aria-hidden', 'true');
    row.append(av, b);
    d.appendChild(row);
  } else {
    d.appendChild(b);
  }
  fil.appendChild(d);
  return d;
}

/* Mode débogage (soutenance / développement) : ?debug=1 affiche la
   traçabilité technique (voie, confiance, latence, SQL). Par défaut,
   l'interface grand public reste épurée — les données restent dans l'API. */
const DEBUG = new URLSearchParams(location.search).has('debug');

function metaPour(d){
  const meta = document.createElement('div'); meta.className = 'meta';
  if (DEBUG){
    if (d.guardrail && d.guardrail !== 'ok'){
      const g = document.createElement('span');
      g.className = 'badge b-guard';
      g.textContent = 'Guardrail : ' + d.guardrail;
      meta.appendChild(g);
    } else {
      const r = document.createElement('span');
      r.className = 'badge b-' + d.route; r.textContent = d.route;
      meta.appendChild(r);
      const c = document.createElement('span'); c.className = 'chip';
      c.textContent = 'confiance ' + Math.round(d.confidence * 100) + '% · ' +
        (d.router_level === 'classifier' ? 'classifieur' : d.router_level);
      meta.appendChild(c);
      const l = document.createElement('span'); l.className = 'chip';
      l.textContent = d.latency_ms + ' ms';
      meta.appendChild(l);
      for (const s of (d.sources || []).filter(s => s.type === 'document')){
        const ch = document.createElement('span'); ch.className = 'chip';
        ch.textContent = '📄 ' + s.document;
        meta.appendChild(ch);
      }
    }
    if (d.cached){
      const ca = document.createElement('span'); ca.className = 'chip';
      ca.textContent = '⚡ cache'; ca.title = 'Réponse servie depuis le cache';
      meta.appendChild(ca);
    }
  }
  const cp = document.createElement('button'); cp.className = 'copier';
  cp.textContent = 'Copier'; cp.setAttribute('aria-label','Copier la réponse');
  cp.onclick = () => {
    navigator.clipboard.writeText(d.answer).then(() => {
      cp.textContent = 'Copié ✓'; setTimeout(() => cp.textContent = 'Copier', 1500);
    });
  };
  meta.appendChild(cp);
  /* feedback (protocole d'évaluation SUS) */
  if (d.message_id){
    const fb = document.createElement('div'); fb.className = 'fb';
    fb.setAttribute('role','group'); fb.setAttribute('aria-label','Évaluer cette réponse');
    for (const [ico, note] of [['👍','up'],['👎','down']]){
      const btn = document.createElement('button');
      btn.textContent = ico;
      btn.setAttribute('aria-label', note === 'up' ? 'Réponse utile' : 'Réponse inutile');
      btn.onclick = async () => {
        fb.querySelectorAll('button').forEach(x => x.classList.remove('actif'));
        btn.classList.add('actif');
        try{ await fetch('/api/feedback', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message_id: d.message_id, session_id: sessionId, rating: note})});
        }catch(e){}
      };
      fb.appendChild(btn);
    }
    meta.appendChild(fb);
  }
  return meta;
}

/* ============ composition d'une réponse complète ============ */
function composer(conteneur, d){
  const bulleEl = conteneur.querySelector('.bulle');
  const multi = d.data && d.data.rows && d.data.rows.length > 1;
  // texte : si tableau structuré disponible, remplacer l'ASCII redondant
  let texte = d.answer;
  if (multi && /^Resultats \(base ANSD\)/.test(texte))
    texte = 'Voici les résultats issus des données publiées par l\'ANSD (' +
            d.data.rows.length + ' lignes) :';
  bulleEl.innerHTML = '<p>' + md(texte) + '</p>';
  conteneur.appendChild(metaPour(d));
  if (multi){
    conteneur.appendChild(tableau(d.data));
    const st = serieTemporelle(d.data);
    const g = st ? grafLigne(d.data, st) : grafBarres(d.data);
    if (g) conteneur.appendChild(g);
  }
  const li = cartesLiens(d.links);
  if (li) conteneur.appendChild(li);
  if (d.sql && DEBUG){
    const det = document.createElement('details'); det.className = 'sqlbox';
    det.innerHTML = '<summary>Requête SQL générée (traçabilité)</summary><code>' + esc(d.sql) + '</code>';
    conteneur.appendChild(det);
  }
  /* les suggestions contextuelles alimentent la zone unique du bas
     (montreSuggs est rappelee en fin de poser) */
  transcript.push({role:'rama', text: texte, route: d.route,
    table: multi ? d.data : null,
    links: d.links || [],
    liens: (d.links || []).map(l => l.titre + ' <' + l.url + '>')});
  if (d.suggestions && d.suggestions.length) dernieresSuggs = d.suggestions;
  sauvegarde();
  /* on NE défile PAS vers la fin : la réponse validée s'affiche à partir de son
     début (la question reste ancrée en haut). Si la réponse déborde, le bouton
     flottant « ↓ » permet d'aller directement au bas. */
}

/* ============ envoi (flux SSE avec repli non-flux) ============ */
async function poser(txt){
  abandonneVoix();
  q.value = ''; go.disabled = true; majBouton();
  /* la zone de suggestions se met en veille pendant la reponse */
  montreSuggs([]);
  masqueAccueil();
  transcript.push({role:'vous', text: txt});
  sauvegarde();
  const msgUser = bulle('user', md(txt));
  const attNode = document.createElement('div');
  attNode.className = 'frappe';
  attNode.innerHTML = '<i></i><i></i><i></i><span class="attente"></span>';
  attNode.setAttribute('aria-label','Le système analyse la question');
  const att = bulle('bot', attNode);
  /* Suivi bas (comme ChatGPT/Claude) : la vue reste collée au bas pendant que la
     réponse s'écrit, la dernière ligne générée est donc toujours visible. Si
     l'utilisateur remonte le fil, le suivi se coupe (voir écouteur de défilement). */
  suivreBas = true;
  requestAnimationFrame(() => versLeBas(false));
  /* messages d'attente progressifs (inférence locale = plusieurs dizaines
     de secondes) : l'utilisateur sait que le système travaille */
  const etapes = [[4,'RAMA analyse votre question…'],
                  [12,'Consultation des données de l\'ANSD…'],
                  [30,'Rédaction de la réponse…'],
                  [60,'Encore un instant — le modèle local rédige une réponse complète…']];
  const attenteTimers = etapes.map(([s,msg]) => setTimeout(() => {
    const el = att.querySelector('.attente'); if (el) el.textContent = msg;
  }, s * 1000));
  const stopAttente = () => attenteTimers.forEach(clearTimeout);
  /* Réseau faible (S8) : on annule si le serveur ne RÉPOND pas dans les
     temps ; une fois le flux commencé, chaque fragment reçu relance le
     minuteur d'inactivité (on ne coupe pas une réponse en cours). */
  const ctrl = new AbortController();
  let watchdog = setTimeout(() => ctrl.abort(), 20000);
  const relance = () => { clearTimeout(watchdog);
    watchdog = setTimeout(() => ctrl.abort(), 25000); };
  try{
    const r = await fetch('/api/chat/stream', {method:'POST',
      headers:{'Content-Type':'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({question: txt, session_id: sessionId})});
    if (r.status === 429) throw new Error('ratelimit');
    if (!r.ok || !r.body) throw new Error('nostream');
    const lecteur = r.body.getReader(), dec = new TextDecoder();
    let tampon = '', texte = '', fini = null, streame = false;
    const bulleEl = att.querySelector('.bulle');
    while (true){
      const {done, value} = await lecteur.read();
      relance();
      if (done) break;
      tampon += dec.decode(value, {stream: true});
      const blocs = tampon.split('\n\n'); tampon = blocs.pop();
      for (const bloc of blocs){
        const ev = (bloc.match(/^event: (\w+)/m) || [])[1];
        const data = (bloc.match(/^data: (.*)$/m) || [])[1];
        if (!ev || data === undefined) continue;
        if (ev === 'delta'){
          const premier = !streame;
          stopAttente(); streame = true;
          texte += JSON.parse(data);
          bulleEl.innerHTML = '<p>' + md(texte) + '<span class="curseur"></span></p>';
          /* Suivi bas : à chaque fragment, on recolle la vue au bas pour que la
             dernière ligne générée reste visible (sauf si l'utilisateur a remonté
             le fil lui-même — suivreBas passe alors à faux). */
          void premier;
          if (suivreBas) versLeBas(false);
        } else if (ev === 'done'){
          fini = JSON.parse(data);
        }
      }
    }
    if (!fini) throw new Error('nostream');
    stopAttente();
    sessionId = fini.session_id || sessionId;
    /* composer() réaffiche fini.answer (source de vérité validée) : sur la
       voie streamée, cela remplace le texte si le rail de fidélité a modifié
       la réponse (repli) ; sinon le texte reste identique. */
    void streame;
    clearTimeout(watchdog);
    composer(att, fini);
    if (suivreBas) requestAnimationFrame(() => versLeBas(false));
  }catch(e){
    stopAttente(); clearTimeout(watchdog);
    if (e.message === 'ratelimit'){
      att.querySelector('.bulle').innerHTML =
        'Trop de requêtes envoyées : patientez une minute puis réessayez.';
    } else {
      /* repli : endpoint non-flux, avec son propre minuteur (réseau faible) */
      try{
        const c2 = new AbortController();
        const t2 = setTimeout(() => c2.abort(), 25000);
        const r2 = await fetch('/api/chat', {method:'POST', signal: c2.signal,
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({question: txt, session_id: sessionId})});
        clearTimeout(t2);
        const d2 = await r2.json();
        sessionId = d2.session_id || sessionId;
        composer(att, d2);
        if (suivreBas) versLeBas(true);  // suivi bas
      }catch(e2){
        att.querySelector('.bulle').innerHTML =
          'La connexion est lente ou indisponible. Vérifiez votre réseau et réessayez.';
      }
    }
  }
  go.disabled = false; majBouton(); q.focus();
  montreSuggs(dernieresSuggs || AMORCES);
}
f.addEventListener('submit', e => {
  e.preventDefault();
  abandonneVoix();
  if (q.value.trim()) poser(q.value.trim());
});

/* ============ persistance de la conversation (P1-5) ============
   La conversation et l'identifiant de session sont conservés sur l'appareil
   de l'usager (localStorage), et restaurés au chargement : la continuité
   d'expérience est préservée après un rafraîchissement. Aucune donnée
   personnelle n'est stockée (Principe 6 de la statistique officielle). */
const CLE_CONV = 'rama-conversation-v1';
function sauvegarde(){
  try{
    localStorage.setItem(CLE_CONV, JSON.stringify(
      {sessionId, transcript, dernieresSuggs, ts: Date.now()}));
  }catch(e){/* quota / mode privé : la persistance est optionnelle */}
}
function masqueAccueil(){
  const a = document.querySelector('.accueil');
  if (a) a.style.display = 'none';
  document.getElementById('chat').classList.remove('vide');
  document.body.classList.remove('vide');
}
function restaure(){
  let sauve;
  try{ sauve = JSON.parse(localStorage.getItem(CLE_CONV) || 'null'); }
  catch(e){ return; }
  if (!sauve || !Array.isArray(sauve.transcript) || !sauve.transcript.length) return;
  sessionId = sauve.sessionId || null;
  transcript = sauve.transcript;
  dernieresSuggs = sauve.dernieresSuggs || null;
  masqueAccueil();
  for (const t of transcript){
    if (t.role === 'vous'){ bulle('user', md(t.text)); continue; }
    const c = bulle('bot', '<p>' + md(t.text) + '</p>');
    if (t.table && t.table.rows && t.table.rows.length > 1){
      c.appendChild(tableau(t.table));
      const st = serieTemporelle(t.table);
      const g = st ? grafLigne(t.table, st) : grafBarres(t.table);
      if (g) c.appendChild(g);
    }
    const li = cartesLiens(t.links);
    if (li) c.appendChild(li);
  }
  montreSuggs(dernieresSuggs || AMORCES);
  fil.lastElementChild?.scrollIntoView({block:'end'});
}

/* ============ actions d'en-tête ============ */
document.getElementById('btn-nouveau').onclick = () => {
  sessionId = null; transcript = []; dernieresSuggs = null;
  fil.querySelectorAll('.msg').forEach(m => m.remove());
  const a = document.querySelector('.accueil'); if (a) a.style.display = '';
  document.getElementById('chat').classList.add('vide');
  document.body.classList.add('vide');
  localStorage.removeItem(CLE_CONV);
  montreSuggs(AMORCES);
  q.focus();
};


/* ============ micro-interactions premium ============ */
/* ============ saisie vocale (#98) ============
   Un seul bouton, trois états permutés automatiquement :
     champ vide -> micro (dicter) · texte -> flèche (envoyer) ·
     dictée en cours -> carré (arrêter), le texte s'écrit en direct.
   Moteur 1 : reconnaissance du navigateur (Web Speech API), texte en direct.
   Moteur 2, repli : enregistrement + transcription serveur Whisper
   (/api/transcribe), partielle toutes les ~3 s puis finale à l'arrêt.
   Arrêt automatique après un silence. La question n'est jamais envoyée
   d'office : l'usager relit, corrige au besoin, puis envoie. */
const Reconnaissance = window.SpeechRecognition || window.webkitSpeechRecognition;
/* mobile : un énoncé par appui (le mode continu y duplique les résultats) */
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const INDICE = q.placeholder, ECOUTE = 'Je vous écoute…', TRANSCRIPTION = 'Transcription…';
const SILENCE_MS = 2000, MUET_MS = 7000, DUREE_MAX_MS = 60000;
/* repli serveur : 1re transcription partielle 1,2 s après le début de la
   parole (le texte apparaît vite), puis toutes les 2,5 s */
const PARTIEL_1_MS = 1200, PARTIEL_MS = 2500;
const MSG_BLOQUE = 'Micro bloqué : autorisez-le pour ce site.',
      MSG_MUET = "Je n'ai rien entendu. Réessayez.",
      MSG_SANS_MICRO = 'Aucun micro détecté.';
const voix = {
  moteur: null,      // 'navigateur' | 'serveur' | null (dictée indisponible)
  serveur: false,    // transcription serveur disponible (/api/health)
  actif: false,
  jeton: 0,          // invalide les événements d'une dictée abandonnée
  base: '',          // texte déjà présent dans le champ avant la dictée
  acquis: '', provisoire: '',
  arret: null,       // arrêt propre : finalise le texte
  annule: null,      // arrêt immédiat : libère le micro sans réécrire le champ
  silence: null,
};

function joint(a, b){
  a = (a || '').trim(); b = (b || '').trim();
  return a && b ? a + ' ' + b : a || b;
}
function afficheDictee(){
  const dit = joint(voix.acquis, voix.provisoire);
  q.value = voix.base ? joint(voix.base, dit) : dit.charAt(0).toUpperCase() + dit.slice(1);
  q.scrollLeft = q.scrollWidth;      // la fin de la dictée reste visible
  majBouton();
}
/* message bref affiché dans le champ lui-même : aucun composant de plus */
function signale(msg){
  q.placeholder = msg;
  clearTimeout(signale.minuteur);
  signale.minuteur = setTimeout(() => { if (!voix.actif) q.placeholder = INDICE; }, 3500);
}
function majBouton(){
  const texte = q.value.trim().length > 0;
  go.classList.toggle('ecoute', voix.actif);
  go.classList.toggle('actif', !voix.actif && texte);
  go.classList.toggle('micro', !voix.actif && !texte && !!voix.moteur);
  f.classList.toggle('ecoute', voix.actif);
  const libelle = voix.actif ? 'Arrêter la dictée'
    : (!texte && voix.moteur) ? 'Dicter votre question' : 'Envoyer la question';
  go.setAttribute('aria-label', libelle); go.title = libelle;
}

function demarreVoix(){
  if (voix.actif || !voix.moteur || go.disabled) return;
  voix.actif = true; voix.jeton++;
  voix.base = q.value.trim(); voix.acquis = ''; voix.provisoire = '';
  clearTimeout(signale.minuteur);
  q.placeholder = ECOUTE;
  majBouton();
  (voix.moteur === 'navigateur' ? ecouteNavigateur : ecouteServeur)(voix.jeton);
}
/* retour au repos ; le texte dicté reste dans le champ */
function termineVoix(){
  voix.actif = false; voix.arret = voix.annule = null;
  clearTimeout(voix.silence);
  if (q.placeholder === ECOUTE || q.placeholder === TRANSCRIPTION) q.placeholder = INDICE;
  go.classList.remove('traite');
  go.style.removeProperty('--niveau');
  majBouton();
}
function arreteVoix(){ if (voix.actif && voix.arret) voix.arret(); }
function abandonneVoix(){
  if (!voix.actif) return;
  const annule = voix.annule;
  voix.jeton++;                      // les événements tardifs seront ignorés
  if (annule) annule();
  termineVoix();
}

/* --- moteur 1 : reconnaissance du navigateur ----------------------------- */
function ecouteNavigateur(jeton){
  const r = new Reconnaissance();
  r.lang = 'fr-FR'; r.interimResults = true; r.maxAlternatives = 1;
  r.continuous = !MOBILE;
  const valide = () => voix.actif && voix.jeton === jeton;
  let entendu = false, bascule = false;
  voix.arret = () => { try{ r.stop(); }catch(e){} };      // finalise, puis onend
  voix.annule = () => { try{ r.abort(); }catch(e){} };
  const muet = setTimeout(() => { if (valide() && !entendu) voix.arret(); }, MUET_MS);
  const max = setTimeout(() => { if (valide()) voix.arret(); }, DUREE_MAX_MS);
  r.onresult = e => {
    if (!valide()) return;
    let fin = '', prov = '';
    for (let i = 0; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) fin += t; else prov += t;
    }
    entendu = true;
    voix.acquis = fin; voix.provisoire = prov;
    afficheDictee();
    clearTimeout(voix.silence);
    voix.silence = setTimeout(() => { if (valide()) voix.arret(); }, SILENCE_MS);
  };
  r.onerror = e => {
    if (!valide()) return;
    const moteurHS = ['network', 'service-not-allowed', 'language-not-supported'].includes(e.error);
    if (moteurHS && voix.serveur){
      /* moteur du navigateur inutilisable (Brave, Siri désactivé…) : on bascule
         durablement sur la transcription serveur, sans rien demander */
      voix.moteur = 'serveur'; bascule = true;
      try{ sessionStorage.setItem('rama-voix', 'serveur'); }catch(err){}
    }
    else if (e.error === 'no-speech') signale(MSG_MUET);
    else if (e.error === 'not-allowed') signale(MSG_BLOQUE);
    else if (e.error === 'audio-capture') signale(MSG_SANS_MICRO);
    else if (e.error !== 'aborted') signale('Dictée indisponible sur ce navigateur.');
  };
  r.onend = () => {
    clearTimeout(muet); clearTimeout(max);
    if (!valide()) return;
    if (bascule && !entendu){ termineVoix(); demarreVoix(); return; }
    /* un résultat provisoire non finalisé (arrêt rapide) est conservé */
    voix.acquis = joint(voix.acquis, voix.provisoire); voix.provisoire = '';
    if (entendu) afficheDictee();
    termineVoix();
  };
  try{ r.start(); }
  catch(e){ clearTimeout(muet); clearTimeout(max); signale('Dictée indisponible.'); termineVoix(); }
}

/* --- moteur 2 : enregistrement + transcription serveur -------------------- */
async function ecouteServeur(jeton){
  const valide = () => voix.actif && voix.jeton === jeton;
  let flux;
  try{
    flux = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1}});
  }catch(e){
    if (voix.jeton === jeton){
      signale(e.name === 'NotAllowedError' ? MSG_BLOQUE : MSG_SANS_MICRO);
      termineVoix();
    }
    return;
  }
  if (!valide()){ flux.getTracks().forEach(t => t.stop()); return; }

  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(flux, type ? {mimeType: type, audioBitsPerSecond: 32000} : undefined);
  const morceaux = [];
  rec.ondataavailable = e => { if (e.data.size) morceaux.push(e.data); };

  /* détecteur de parole : niveau RMS comparé au bruit ambiant mesuré au départ
     -> arrêt sur silence, et anneau du bouton qui suit la voix */
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const analyseur = ctx.createAnalyser(); analyseur.fftSize = 1024;
  ctx.createMediaStreamSource(flux).connect(analyseur);
  const ech = new Uint8Array(analyseur.fftSize);
  const debut = performance.now();
  let bruit = 0, nBruit = 0, parle = false, debutParole = 0, derniereVoix = 0, dernierEnvoi = 0;
  let envoyes = 0, enVol = false, seq = 0, affiche = 0, fini = false, partiel = null;

  const libere = () => { flux.getTracks().forEach(t => t.stop()); ctx.close().catch(() => {}); };
  /* chaque envoi porte tout l'audio depuis le début (fichier valide) ; une
     réponse plus ancienne que celle déjà affichée est ignorée */
  const transcrit = async () => {
    const n = ++seq; envoyes = morceaux.length;
    const blob = new Blob(morceaux, {type: rec.mimeType || 'audio/webm'});
    const ctrl = new AbortController();
    const delai = setTimeout(() => ctrl.abort(), 12000);   // réseau faible : jamais bloqué
    try{
      const r = await fetch('/api/transcribe', {method: 'POST', signal: ctrl.signal,
        headers: {'Content-Type': blob.type}, body: blob});
      if (!r.ok) return;
      const d = await r.json();
      if (voix.jeton !== jeton || n < affiche) return;
      affiche = n; voix.acquis = d.texte || '';
      afficheDictee();
    }catch(e){ /* réseau : la transcription finale réessaiera */ }
    finally{ clearTimeout(delai); }
  };
  const arrete = () => {
    if (fini) return;
    fini = true; clearInterval(partiel);
    q.placeholder = TRANSCRIPTION;
    go.classList.add('traite');
    go.style.removeProperty('--niveau');
    let clos = false;
    const cloture = async () => {
      if (clos) return;
      clos = true; libere();
      if (parle && morceaux.length) await transcrit();
      if (voix.jeton === jeton){
        if (parle && !q.value.trim()) signale(MSG_MUET);
        termineVoix();
      }
    };
    rec.onstop = cloture;
    setTimeout(cloture, 3000);      // filet : enregistreur qui ne se ferme pas
    try{ rec.stop(); }catch(e){ cloture(); }
  };
  const annule = () => {
    if (fini) return;
    fini = true; clearInterval(partiel);
    rec.onstop = null;
    try{ rec.stop(); }catch(e){}
    libere();
  };
  voix.arret = arrete; voix.annule = annule;

  const boucle = () => {
    if (!valide() || fini) return;
    analyseur.getByteTimeDomainData(ech);
    let somme = 0;
    for (const v of ech){ const x = (v - 128) / 128; somme += x * x; }
    const rms = Math.sqrt(somme / ech.length), t = performance.now();
    if (t - debut < 400){ bruit += rms; nBruit++; }          // calibrage
    const seuil = Math.min(0.06, Math.max(0.02, nBruit ? 2.5 * bruit / nBruit : 0.02));
    if (rms > seuil){ if (!parle) debutParole = t; parle = true; derniereVoix = t; }
    go.style.setProperty('--niveau', Math.min(1, rms * 6).toFixed(2));
    if (parle && t - derniereVoix > SILENCE_MS) return arrete();
    if (!parle && t - debut > MUET_MS){ signale(MSG_MUET); annule(); termineVoix(); return; }
    if (t - debut > DUREE_MAX_MS) return arrete();
    requestAnimationFrame(boucle);
  };

  rec.start(500);
  partiel = setInterval(() => {
    const t = performance.now();
    const du = seq ? dernierEnvoi + PARTIEL_MS : debutParole + PARTIEL_1_MS;
    if (parle && !enVol && t >= du && morceaux.length > envoyes){
      enVol = true; dernierEnvoi = t;
      transcrit().finally(() => { enVol = false; });
    }
  }, 200);
  requestAnimationFrame(boucle);
}

/* --- choix du moteur, branchements --------------------------------------- */
(function initVoix(){
  if (!window.isSecureContext) return;               // micro exige HTTPS
  let force = new URLSearchParams(location.search).get('voix');
  try{ force = force || sessionStorage.getItem('rama-voix'); }catch(e){}
  if (Reconnaissance && force !== 'serveur') voix.moteur = 'navigateur';
  majBouton();
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) return;
  fetch('/api/health').then(r => r.json()).then(h => {
    voix.serveur = !!h.voix_serveur;
    if (voix.serveur && !voix.moteur){ voix.moteur = 'serveur'; majBouton(); }
  }).catch(() => {});
})();
go.addEventListener('click', e => {
  if (voix.actif){ e.preventDefault(); arreteVoix(); return; }
  if (!q.value.trim() && voix.moteur){ e.preventDefault(); demarreVoix(); }
});
/* frappe pendant la dictée : l'usager reprend la main, le texte est gardé */
q.addEventListener('input', () => { if (voix.actif) abandonneVoix(); majBouton(); });

/* "/" focalise le champ de saisie (raccourci standard) */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if (e.key === 'Escape'){ if (voix.actif) arreteVoix(); else q.blur(); }
});

/* Clavier virtuel (mobile/tablette) : on cale la hauteur de l'app sur la zone
   RÉELLEMENT visible (visualViewport). Clavier ouvert -> l'app se réduit et la
   barre de saisie reste juste au-dessus du clavier, jamais masquée. Aucun
   débordement (overflow:hidden) ni zoom (input 16px). */
(function clage(){
  const vv = window.visualViewport;
  if (!vv) return;                       // navigateurs sans l'API : repli 100dvh
  const applique = () => {
    document.documentElement.style.setProperty('--appvh', vv.height + 'px');
  };
  vv.addEventListener('resize', applique);
  vv.addEventListener('scroll', applique);
  applique();
})();

/* Toucher HORS de la barre de saisie referme le clavier (le champ revient en
   place). On ne défocalise pas si le geste vise la barre elle-même. */
document.addEventListener('pointerdown', (e) => {
  if (document.activeElement === q && !e.target.closest('#barre')) q.blur();
}, {passive:true});

/* bouton flottant vers le dernier message quand on a remonte le fil */
const chatEl = document.getElementById('chat'), basBtn = document.getElementById('bas');
/* Colle la vue au bas (suivi de génération, style ChatGPT/Claude). Défini en
   déclaration (hoistée) : appelable depuis poser() plus haut. */
function versLeBas(doux){
  chatEl.scrollTo({top: chatEl.scrollHeight, behavior: doux ? 'smooth' : 'auto'});
}
chatEl.addEventListener('scroll', () => {
  const loin = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight > 300;
  suivreBas = !loin;   /* si l'utilisateur remonte le fil, on cesse de suivre le bas */
  basBtn.classList.toggle('visible', loin);
});
basBtn.onclick = () => chatEl.scrollTo({top: chatEl.scrollHeight, behavior:'smooth'});

/* restauration de la conversation précédente (P1-5), sauf démo par URL */
const params = new URLSearchParams(location.search);
if (params.get('theme')) appliqueTheme(params.get('theme'));
if (params.get('q')){
  poser(params.get('q'));           // lien de démo : conversation fraîche
} else {
  restaure();                        // usage normal : on reprend où on en était
}
if (!transcript.length) montreSuggs(AMORCES);
/* focus initial au clavier physique seulement : sur mobile, il ouvrirait le
   clavier virtuel et masquerait l'accueil. */
if (matchMedia('(pointer: fine)').matches) q.focus();
</script>
